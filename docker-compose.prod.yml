# docker-compose.prod.yml — déploiement production/recette, variante
# REGISTRE (images déjà construites et poussées vers un registre). Variante
# alternative sans dépendance à un registre : docker-compose.prod.build.yml
# (build directement sur l'hôte de déploiement depuis les Dockerfiles) —
# choisir l'un des deux, jamais les deux en même temps sur le même hôte.
#
# Architecture réelle confirmée (19/08/2026, remplace l'hypothèse initiale
# d'hébergement externe) : serveur local UNIQUE qui héberge à la fois
# Postgres/Redis/RabbitMQ ET les trois applications (api/web/worker) — pas de
# service managé séparé. Les trois services d'infrastructure sont donc
# définis ci-dessous, avec volumes nommés pour la persistance (Postgres et
# RabbitMQ en particulier : perdre ces données au redémarrage d'un conteneur
# serait inacceptable sur un vrai déploiement — Redis reste volontairement
# plus léger, cf. CLAUDE.md règle non négociable 4 : « Redis est un reflet
# volatil intégralement reconstructible », un volume lui est tout de même
# donné par cohérence avec le profil dev, pas par nécessité).
#
# Distinct de docker-compose.yml (base dev, fusionné avec
# docker-compose.override.yml en local — build inline, target `deps`, bind
# mounts). Ici :
#   - Postgres/Redis/RabbitMQ auto-hébergés sur CE MÊME serveur, réseau Docker
#     interne uniquement pour les apps (DATABASE_URL/REDIS_URL/RABBITMQ_HOST
#     construits en dur vers les noms de service ci-dessous, plus besoin de
#     les fournir dans .env.prod) — jamais exposés au réseau externe ; seuls
#     Postgres (admin/backup) et la console RabbitMQ (supervision) sont
#     publiés, et seulement sur 127.0.0.1 (accès par tunnel SSH depuis
#     l'hôte, jamais directement depuis le réseau).
#   - AUCUN `build:` sur api/web/worker — les trois images sont déjà
#     construites (Dockerfiles corrigés : node:24-slim, .dockerignore
#     réparé, HEALTHCHECK intégré) et référencées par tag, jamais
#     reconstruites sur l'hôte de déploiement. DOCKER_REGISTRY dépend d'un
#     Nexus interne pas encore prêt côté DevOps au moment où ce fichier est
#     révisé (cf. CLAUDE.md, « Dépendances externes en attente ») — ce
#     fichier reste correct et prêt, son usage attend cette dépendance
#     externe, pas l'inverse. docker-compose.prod.build.yml reste l'option
#     immédiatement utilisable sans registre le temps que Nexus arrive.
#   - AUCUNE valeur en dur, secret ou non — tout vient de .env.prod (jamais
#     commité, cf. .env.prod.example) via ${VARIABLE}. Même discipline que
#     celle appliquée après l'incident de rotation JWT/REFRESH_TOKEN/TOTP
#     (cf. CLAUDE.md, section « Incident — secrets exposés »).
#
# Usage :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# NEXT_PUBLIC_API_URL (apps/web) — NE FIGURE PAS dans `environment:`
# ci-dessous, volontairement. Next.js inline cette variable dans le bundle
# CLIENT au moment du `next build` (apps/web/lib/api.ts:116), jamais relue à
# l'exécution du conteneur — `apps/web/Dockerfile` déclare désormais
# `ARG NEXT_PUBLIC_API_URL` dans le stage `build`, mais CE FICHIER compose ne
# construit jamais d'image (`image:`, pas `build:`) : il ne peut donc jamais
# influencer cette valeur, quoi qu'on écrive ici. Elle doit être fournie au
# moment où l'image est réellement construite (le pipeline qui la pousse vers
# le registre, hors de ce dépôt), via :
#   docker build --build-arg NEXT_PUBLIC_API_URL=https://pgd.orange.ci \
#     -f apps/web/Dockerfile -t <registre>/pgd-web:<tag> .
# L'ajouter en `environment:` ici serait sans effet et laisserait croire à
# tort que ce fichier peut la corriger après coup — cf. .env.prod.example
# pour la même mise en garde côté variables d'environnement.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER doit être défini dans .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB doit être défini dans .env.prod}
    volumes:
      - pgd_prod_postgres_data:/var/lib/postgresql/data
    # 127.0.0.1 uniquement — admin/backup via tunnel SSH sur l'hôte, jamais
    # exposé au réseau. Les apps atteignent ce service par son nom Docker
    # (`postgres`), ce port publié ne leur sert à rien.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sauvegarde Postgres (19/08/2026, mécanisme distinct de Nexus — en
  # parallèle de cette dépendance externe en attente, pas bloqué par elle).
  # Service dédié, jamais un cron hôte — cohérent avec le reste de ce
  # fichier : tout est déclaré ici, rien ne dépend d'un état externe non
  # versionné. cf. CLAUDE.md, section dédiée, pour la conception complète.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER doit être défini dans .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB doit être défini dans .env.prod}
      # Fréquence/rétention : proposées à 86400s (quotidien) / 7 jours,
      # actées comme défaut par la personne pilotant le projet (19/08/2026)
      # — restent overridables dans .env.prod si la décision change.
      BACKUP_INTERVAL_SECONDES: ${BACKUP_INTERVAL_SECONDES:-86400}
      BACKUP_RETENTION_JOURS: ${BACKUP_RETENTION_JOURS:-7}
      # Vide par défaut — destination distante non encore communiquée côté
      # infrastructure Orange (19/08/2026). Le mécanisme reste pleinement
      # fonctionnel en local seul tant que cette variable n'est pas fournie
      # — jamais une condition bloquante, cf. docker/backup/backup.sh.
      BACKUP_REMOTE_TARGET: ${BACKUP_REMOTE_TARGET:-}
    volumes:
      - pgd_prod_backups_data:/backups
      # rclone.conf : uniquement nécessaire une fois BACKUP_REMOTE_TARGET
      # renseigné (protocole/identifiants propres à la destination réelle,
      # jamais dans ce dépôt). Absent aujourd'hui — décommenter le jour où
      # la destination distante est connue et ce fichier créé hors du dépôt.
      # - ./secrets/rclone.conf:/config/rclone/rclone.conf:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pgd_prod_redis_data:/data
    # Aucun port publié — cache/verrous internes uniquement (CLAUDE.md règle
    # 4, reconstructible), aucun besoin d'accès admin distinct de `docker
    # compose exec redis redis-cli` depuis l'hôte.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER doit être défini dans .env.prod}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD doit être défini dans .env.prod}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/pgd}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?RABBITMQ_ERLANG_COOKIE doit être défini dans .env.prod}
    volumes:
      - pgd_prod_rabbitmq_data:/var/lib/rabbitmq
    # Console de supervision (15672) en 127.0.0.1 uniquement — tunnel SSH
    # pour y accéder, jamais exposée directement. Le port AMQP (5672) n'est
    # publié nulle part : les apps l'atteignent par le réseau Docker interne.
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY doit être défini dans .env.prod}/pgd-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # Postgres/Redis/RabbitMQ auto-hébergés ci-dessus, sur ce même serveur
      # — noms de service Docker, jamais un hôte externe. DATABASE_URL n'est
      # plus une variable fournie dans .env.prod (elle l'était quand
      # l'hébergement était externe) : construite ici depuis les identifiants
      # Postgres, seule source de vérité désormais.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER doit être défini dans .env.prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env.prod}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB doit être défini dans .env.prod}?schema=public
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER doit être défini dans .env.prod}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD doit être défini dans .env.prod}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pgd}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN doit être défini dans .env.prod (URL publique de apps/web)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env.prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET doit être défini dans .env.prod}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pgd_session}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-pgd_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # AUTH_PROVIDER — AdApiProvider restauré le 24/08/2026 comme mesure
      # TRANSITOIRE (cf. CLAUDE.md « Restauration transitoire —
      # AdApiProvider »), défaut "ad-api" depuis le même jour. ⚠️ ce chemin ne
      # déclenche aucune étape MFA, ni PGD ni Keycloak, pour aucun rôle — y
      # compris SM_DF/DF/DGA_DG/ADMIN, qui exigent la double authentification
      # selon docs/09. Décision à reconfirmer explicitement avant tout
      # déploiement réel — cf. §4/§8 du guide de déploiement.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-ad-api}
      AD_API_URL: ${AD_API_URL:-}
      AD_API_TIMEOUT_MS: ${AD_API_TIMEOUT_MS:-5000}
      # Keycloak — fournisseur cible d'authentification, identité ET second
      # facteur quand actif (décision actée le 24/08/2026, remplace LdapPort/
      # LdapProvider/AdApiProvider/OpenLDAP ET MfaService/TotpProvider/
      # DuoProvider, tous retirés — cf. CLAUDE.md « Architecture Keycloak —
      # source unique »). Aucun conteneur Keycloak ici : royaume réel,
      # jamais celui, éphémère, d'un éventuel service de dev.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?KEYCLOAK_BASE_URL doit être défini dans .env.prod}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM doit être défini dans .env.prod}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID doit être défini dans .env.prod}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET doit être défini dans .env.prod}
      KEYCLOAK_TIMEOUT_MS: ${KEYCLOAK_TIMEOUT_MS:-60000}
      RATE_LIMIT_LOGIN_MAX_TENTATIVES: ${RATE_LIMIT_LOGIN_MAX_TENTATIVES:-5}
      RATE_LIMIT_LOGIN_FENETRE_SECONDES: ${RATE_LIMIT_LOGIN_FENETRE_SECONDES:-300}
      RATE_LIMIT_LOGIN_VERROUILLAGE_SECONDES: ${RATE_LIMIT_LOGIN_VERROUILLAGE_SECONDES:-900}
      GED_STORAGE_PATH: ${GED_STORAGE_PATH:-/tmp/pgd-ged}
      GED_MAX_TAILLE_OCTETS: ${GED_MAX_TAILLE_OCTETS:-10485760}
    ports:
      - "${API_PORT:-3000}:3000"

  worker:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY doit être défini dans .env.prod}/pgd-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER doit être défini dans .env.prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env.prod}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB doit être défini dans .env.prod}?schema=public
      REDIS_URL: redis://redis:6379
      # packages/config expose un schéma Zod partagé par toutes les apps
      # (Phase 1, choix documenté dans docker-compose.yml) — loadEnv()
      # échoue sans ces variables même si apps/worker ne les utilise pas
      # réellement (session/AD/MFA n'existent pas côté worker).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env.prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET doit être défini dans .env.prod}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?KEYCLOAK_BASE_URL doit être défini dans .env.prod}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM doit être défini dans .env.prod}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID doit être défini dans .env.prod}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET doit être défini dans .env.prod}
      KEYCLOAK_TIMEOUT_MS: ${KEYCLOAK_TIMEOUT_MS:-60000}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER doit être défini dans .env.prod}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD doit être défini dans .env.prod}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pgd}
    ports:
      - "${WORKER_HEALTH_PORT:-3002}:3002"

  web:
    image: ${DOCKER_REGISTRY:?DOCKER_REGISTRY doit être défini dans .env.prod}/pgd-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - api

volumes:
  pgd_prod_postgres_data:
  pgd_prod_redis_data:
  pgd_prod_rabbitmq_data:
  # Socle local du mécanisme de sauvegarde — sur le même disque physique que
  # les autres volumes de cet hôte par défaut. Protège contre une perte de
  # conteneur/volume Postgres, PAS contre une panne disque/serveur complète
  # (cf. CLAUDE.md, section dédiée) : la destination distante
  # (BACKUP_REMOTE_TARGET) reste nécessaire pour cette protection-là.
  pgd_prod_backups_data:
