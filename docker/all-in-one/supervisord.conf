; docker/all-in-one/supervisord.conf — config autonome, invoquée directement
; via `supervisord -c .../supervisord.conf` (CMD du Dockerfile) : jamais
; fusionnée avec le /etc/supervisor/*.conf par défaut de Debian, pour éviter
; toute ambiguïté sur quelle section [supervisord] fait foi.
;
; Redis démarre en premier (priority la plus basse), les trois apps Node
; ensuite — aucune vraie dépendance de démarrage ordonnée entre elles côté
; supervisord (contrairement à docker-compose.prod.yml, qui a de vrais
; healthcheck `depends_on`) : chaque app tolère déjà un Redis pas encore prêt
; au tout premier démarrage (CacheService se reconnecte), donc `priority`
; sert seulement à un ordre de démarrage raisonnable, pas une garantie dure.

[supervisord]
; Pas de `user=` ici : le conteneur tourne déjà en tant que `pgd`
; (USER pgd, Dockerfile) — supervisord n'est jamais root, il ne peut donc
; pas changer d'utilisateur (`user=` exigerait un supervisord root qui
; abandonne ses privilèges, pas notre cas).
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/tmp/supervisord.pid

; Socket RPC pour `supervisorctl` (docker exec <conteneur> supervisorctl
; -c .../supervisord.conf status) — sans ces trois sections, aucune interface
; de contrôle n'existe (constaté en vérification live : `supervisorctl
; status` échouait avec « no such file », faute de socket déclaré).
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
; --save ""/--appendonly no : aucune persistance disque — cohérent avec
; « Redis est un reflet volatil intégralement reconstructible » (CLAUDE.md,
; règle non négociable 4), évite aussi tout souci de permission sur un
; répertoire de données non préparé pour l'utilisateur `pgd`. --dir /tmp
; par prudence si Redis écrit malgré tout un fichier temporaire (BGSAVE
; déclenché manuellement, jamais par ce process en configuration normale).
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --dir /tmp
priority=1
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node dist/main.js
directory=/repo/apps/api
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=node dist/main.js
directory=/repo/apps/worker
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
; Chemin ABSOLU obligatoire, pas relatif malgré `directory=` ci-dessous —
; trouvaille en vérification live : supervisord résout un `command=` relatif
; contenant un `/` depuis le CWD du process supervisord LUI-MÊME (`/repo`,
; fixé par le WORKDIR du Dockerfile), jamais depuis le `directory=` du
; programme (qui ne s'applique qu'au CWD du process ENFANT, après le fork) —
; contrairement à `node dist/main.js` (api/worker), où `node` reçoit un
; chemin de script relatif à SON PROPRE cwd après chdir, pas un exécutable
; à localiser avant fork. `node_modules/.bin/next` échouait donc avec
; `spawnerr: can't find command` (cherché à tort en /repo/node_modules/.bin/
; next, jamais hoisté là par pnpm) — corrigé en chemin absolu réel.
command=/repo/apps/web/node_modules/.bin/next start -p 3001
directory=/repo/apps/web
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
