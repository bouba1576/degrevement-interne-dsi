services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgd}
      POSTGRES_DB: ${POSTGRES_DB:-pgd}
    volumes:
      - pgd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pgd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pgd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pgd}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pgd}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/pgd}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pgd-dev-cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pgd_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # connection_limit explicite (01/09/2026, diagnostic P2037 "too many
      # clients already") — sans lui, Prisma retombe sur son défaut
      # num_cpus*2+1, une valeur qui varie silencieusement avec le nombre de
      # cœurs de l'hôte et n'offre donc aucune garantie connue. 20 est
      # dimensionné pour couvrir le pire cas d'UN chargement Pilotage après
      # bornage de KpiEngineService (concurrenceMax=5, ~4 sous-requêtes max
      # par définition ≈ 20) sans forcer de file d'attente pour un seul
      # utilisateur, tout en restant un budget FIXE et connu plutôt que de
      # dépendre du CPU — un second chargement Pilotage concurrent est mis en
      # file d'attente par Prisma (dégradation, pas un échec), jamais un
      # nouveau P2037. max_connections Postgres = 100 (dev) ; api(20) +
      # worker(10, ci-dessous) + processus internes Postgres (~6) laissent
      # une marge large pour Adminer/psql et une éventuelle réplique
      # supplémentaire — à revisiter si le nombre de répliques api augmente.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pgd}:${POSTGRES_PASSWORD:-pgd}@postgres:5432/${POSTGRES_DB:-pgd}?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER:-pgd}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pgd}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pgd}
      CORS_ORIGIN: http://localhost:3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pgd_session}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-pgd_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Keycloak reste le fournisseur cible, identité ET second facteur (cf.
      # CLAUDE.md « Architecture Keycloak — source unique »). AUTH_PROVIDER
      # restaure une sélection à deux fournisseurs (AdApiProvider, mesure
      # transitoire, cf. CLAUDE.md « Restauration transitoire —
      # AdApiProvider ») — service `api` uniquement, `worker` n'authentifie
      # jamais. Prod : royaume réel. Dev : cf. docker-compose.override.yml
      # (service keycloak éphémère si construit — jamais la même
      # KEYCLOAK_BASE_URL dans les deux).
      AUTH_PROVIDER: ${AUTH_PROVIDER:-ad-api}
      AD_API_URL: ${AD_API_URL:-}
      AD_API_TIMEOUT_MS: ${AD_API_TIMEOUT_MS:-5000}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_TIMEOUT_MS: ${KEYCLOAK_TIMEOUT_MS:-60000}
      RATE_LIMIT_LOGIN_MAX_TENTATIVES: ${RATE_LIMIT_LOGIN_MAX_TENTATIVES:-5}
      RATE_LIMIT_LOGIN_FENETRE_SECONDES: ${RATE_LIMIT_LOGIN_FENETRE_SECONDES:-300}
      RATE_LIMIT_LOGIN_VERROUILLAGE_SECONDES: ${RATE_LIMIT_LOGIN_VERROUILLAGE_SECONDES:-900}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 3002
      # connection_limit explicite, même raisonnement que le service api
      # ci-dessus — 10, plus bas que api : worker n'a aucun chemin de code
      # comparable au fan-out de KpiEngineService (cron SLA/verrous,
      # notifications, si-push, tous à prefetch=1/traitement séquentiel par
      # message, cf. CLAUDE.md).
      DATABASE_URL: postgresql://${POSTGRES_USER:-pgd}:${POSTGRES_PASSWORD:-pgd}@postgres:5432/${POSTGRES_DB:-pgd}?schema=public&connection_limit=10
      REDIS_URL: redis://redis:6379
      # apps/worker n'utilise aucune de ces variables — packages/config expose
      # un schéma Zod partagé par toutes les apps (choix de Phase 1), donc
      # loadEnv() échoue sans elles même ici. À corriger proprement en scindant
      # le schéma par app si ça devient gênant ; pas fait maintenant pour ne
      # pas rouvrir packages/config sous pression de fin de phase.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_TIMEOUT_MS: ${KEYCLOAK_TIMEOUT_MS:-60000}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER:-pgd}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pgd}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pgd}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - api

  # Adminer — client web léger pour PostgreSQL, outil de dev/debug
  # uniquement (jamais ajouté à docker-compose.prod*.yml : un accès web
  # direct à la base, même authentifié par les identifiants Postgres, est
  # une surface qui n'a rien à faire en production). ADMINER_DEFAULT_SERVER
  # pré-remplit le champ « Serveur » du formulaire de connexion avec le nom
  # du service Postgres interne — reste un identifiant/mot de passe à
  # saisir à chaque connexion, rien n'est stocké en clair ici.
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgd_postgres_data:
  pgd_redis_data:
  pgd_rabbitmq_data:
