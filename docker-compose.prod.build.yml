# docker-compose.prod.build.yml — déploiement production/recette, VARIANTE
# « build sur l'hôte de déploiement ».
#
# Alternative à docker-compose.prod.yml (qui référence des images déjà
# construites et poussées vers un registre — DOCKER_REGISTRY, question
# ouverte non confirmée dans ce dépôt, cf. .env.prod.example). Ici, à
# l'inverse :
#   - `build:` sur les trois services — reconstruits directement sur l'hôte
#     de déploiement depuis les Dockerfiles corrigés (node:24-slim,
#     .dockerignore réparé, HEALTHCHECK intégré), jamais d'`image:`/tag de
#     registre.
#   - AUCUN service Postgres/Redis/RabbitMQ auto-hébergé — même choix que
#     docker-compose.prod.yml, connexions externes uniquement.
#   - AUCUNE valeur en dur — tout vient de .env.prod (jamais commité) via
#     ${VARIABLE}, même discipline que docker-compose.prod.yml.
#
# Prérequis propre à CETTE variante, absent de la variante registre : le
# CODE SOURCE complet doit être présent sur l'hôte de déploiement (le champ
# `context: .` a besoin des Dockerfiles ET de tout ce qu'ils COPYent — pas
# seulement d'un artefact déjà construit). En pratique : `git clone`/`git
# pull` de ce dépôt sur l'hôte avant `up`, puis rejouer à chaque nouvelle
# version — sensiblement plus lourd qu'un `docker pull` d'image déjà prête,
# et le premier build (~2 min par service constaté en vérification locale)
# se reproduit sur l'hôte de prod à chaque déploiement, pas une seule fois
# en amont dans un pipeline CI.
#
# Usage :
#   git clone <ce dépôt> /opt/pgd && cd /opt/pgd
#   docker compose -f docker-compose.prod.build.yml --env-file .env.prod up -d --build
#
# `--build` force la reconstruction même si des images du même nom existent
# déjà localement (sinon `up` réutiliserait une image locale périmée après
# un `git pull`).
#
# NEXT_PUBLIC_API_URL (apps/web) — DIFFÉRENCE IMPORTANTE avec
# docker-compose.prod.yml : ici, ce fichier construit réellement l'image, il
# PEUT donc et DOIT transmettre cette variable via `build.args` (Compose la
# passe alors en `--build-arg` à `docker build`, exactement comme
# apps/web/Dockerfile l'attend — `ARG NEXT_PUBLIC_API_URL`). Contrairement à
# la variante registre, la renseigner dans .env.prod a ici un effet réel —
# cf. .env.prod.example pour la note qui distingue les deux fichiers sur ce
# point précis.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL doit être défini dans .env.prod}
      REDIS_URL: ${REDIS_URL:?REDIS_URL doit être défini dans .env.prod}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST doit être défini dans .env.prod}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER doit être défini dans .env.prod}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD doit être défini dans .env.prod}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pgd}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN doit être défini dans .env.prod (URL publique de apps/web)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env.prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET doit être défini dans .env.prod}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pgd_session}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-pgd_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Prod : AD réel Orange CI (LDAPS attendu). Aucun conteneur openldap ici
      # — celui de docker-compose.override.yml est strictement dev.
      LDAP_URL: ${LDAP_URL:?LDAP_URL doit être défini dans .env.prod}
      LDAP_BIND_DN: ${LDAP_BIND_DN:?LDAP_BIND_DN doit être défini dans .env.prod}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:?LDAP_BIND_PASSWORD doit être défini dans .env.prod}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?LDAP_BASE_DN doit être défini dans .env.prod}
      LDAP_USER_DOMAIN: ${LDAP_USER_DOMAIN:-orange.ci}
      DUO_CLIENT_ID: ${DUO_CLIENT_ID:?DUO_CLIENT_ID doit être défini dans .env.prod}
      DUO_CLIENT_SECRET: ${DUO_CLIENT_SECRET:?DUO_CLIENT_SECRET doit être défini dans .env.prod}
      DUO_API_HOST: ${DUO_API_HOST:?DUO_API_HOST doit être défini dans .env.prod}
      DUO_REDIRECT_URI: ${DUO_REDIRECT_URI:?DUO_REDIRECT_URI doit être défini dans .env.prod}
      TOTP_ISSUER: ${TOTP_ISSUER:-PGD Orange CI}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY doit être défini dans .env.prod}
      RATE_LIMIT_LOGIN_MAX_TENTATIVES: ${RATE_LIMIT_LOGIN_MAX_TENTATIVES:-5}
      RATE_LIMIT_LOGIN_FENETRE_SECONDES: ${RATE_LIMIT_LOGIN_FENETRE_SECONDES:-300}
      RATE_LIMIT_LOGIN_VERROUILLAGE_SECONDES: ${RATE_LIMIT_LOGIN_VERROUILLAGE_SECONDES:-900}
      GED_STORAGE_PATH: ${GED_STORAGE_PATH:-/tmp/pgd-ged}
      GED_MAX_TAILLE_OCTETS: ${GED_MAX_TAILLE_OCTETS:-10485760}
      TACHE_VERROU_TTL_SECONDES: ${TACHE_VERROU_TTL_SECONDES:-1800}
    ports:
      - "${API_PORT:-3000}:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: 3002
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL doit être défini dans .env.prod}
      REDIS_URL: ${REDIS_URL:?REDIS_URL doit être défini dans .env.prod}
      # packages/config expose un schéma Zod partagé par toutes les apps
      # (Phase 1, choix documenté dans docker-compose.yml) — loadEnv()
      # échoue sans ces variables même si apps/worker ne les utilise pas
      # réellement (session/AD/MFA n'existent pas côté worker).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env.prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET doit être défini dans .env.prod}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      LDAP_URL: ${LDAP_URL:?LDAP_URL doit être défini dans .env.prod}
      LDAP_BIND_DN: ${LDAP_BIND_DN:?LDAP_BIND_DN doit être défini dans .env.prod}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:?LDAP_BIND_PASSWORD doit être défini dans .env.prod}
      LDAP_BASE_DN: ${LDAP_BASE_DN:?LDAP_BASE_DN doit être défini dans .env.prod}
      DUO_CLIENT_ID: ${DUO_CLIENT_ID:?DUO_CLIENT_ID doit être défini dans .env.prod}
      DUO_CLIENT_SECRET: ${DUO_CLIENT_SECRET:?DUO_CLIENT_SECRET doit être défini dans .env.prod}
      DUO_API_HOST: ${DUO_API_HOST:?DUO_API_HOST doit être défini dans .env.prod}
      DUO_REDIRECT_URI: ${DUO_REDIRECT_URI:?DUO_REDIRECT_URI doit être défini dans .env.prod}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY doit être défini dans .env.prod}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST doit être défini dans .env.prod}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER doit être défini dans .env.prod}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD doit être défini dans .env.prod}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/pgd}
    ports:
      - "${WORKER_HEALTH_PORT:-3002}:3002"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Seul service des trois où `build.args` a un effet réel côté
      # application — cf. note en tête de fichier. `:?` volontaire : un
      # oubli silencieux ici reproduirait exactement le défaut déjà trouvé
      # et corrigé (retour au "http://localhost:3000" codé en dur).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL doit être défini dans .env.prod pour cette variante (URL publique de pgd-api)}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      - api
